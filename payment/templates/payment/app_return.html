<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tamaade – Back to the app</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, sans-serif; background: #365944; color: #fff; text-align: center; }
    main { padding: 24px; max-width: 360px; }
    h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: 2px; }
    p { opacity: .9; line-height: 1.5; }
    a.btn { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 999px;
            background: #fff; color: #365944; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>TAMAADE</h1>
    {% if success %}
      <p>Payment finished. Returning you to the Tamaade app…</p>
    {% else %}
      <p>Payment cancelled. Returning you to the Tamaade app…</p>
    {% endif %}
    <a class="btn" href="{{ deep_link }}">Open the Tamaade app</a>
  </main>
  <script>window.location.replace(document.querySelector("a.btn").href);</script>
</body>
</html>
